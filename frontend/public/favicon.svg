<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="16 12" opacity="0.6" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.8" />

  <!-- Compass Cardinal points -->
  <polygon points="256,60 264,88 256,80 248,88" fill="#10b981" />
  <polygon points="256,452 264,424 256,432 248,424" fill="#06b6d4" opacity="0.6" />
  <polygon points="60,256 88,264 80,256 88,248" fill="#10b981" opacity="0.6" />
  <polygon points="452,256 424,264 432,256 424,248" fill="#06b6d4" opacity="0.6" />

  <!-- Location Pin Glow -->
  <g filter="url(#glow)">
    <!-- Pin Body -->
    <path d="M 256,120 C 196,120 148,168 148,228 C 148,310 256,400 256,400 C 256,400 364,310 364,228 C 364,168 316,120 256,120 Z" 
          fill="url(#accentGrad)" />
    <!-- Pin Cutout -->
    <circle cx="256" cy="225" r="46" fill="#090d16" />
    <!-- Student Spark / Compass needle in center -->
    <polygon points="256,195 264,225 256,218 248,225" fill="#10b981" />
    <polygon points="256,255 264,225 256,232 248,225" fill="#06b6d4" />
  </g>
</svg>